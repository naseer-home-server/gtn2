# Include with docker compose -f docker-compose.yml -f docker-compose.roster.yml ...
# PLAYER_ROSTER_FILE is a private JSON file on the Docker host, outside this repository.
services:
  game:
    environment:
      PLAYER_ROSTER_PATH: /run/gtn2/player-roster.json
    volumes:
      - type: bind
        source: ${PLAYER_ROSTER_FILE:?Set PLAYER_ROSTER_FILE to the private roster export on the Docker host}
        target: /run/gtn2/player-roster.json
        read_only: true
        bind:
          create_host_path: false
