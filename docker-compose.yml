services:
  # Started explicitly by pnpm setup:local/db:up; deployment still uses DATABASE_URL.
  postgres:
    image: postgres:17-alpine
    profiles: [local]
    environment:
      POSTGRES_USER: gtn2
      POSTGRES_PASSWORD: gtn2
      POSTGRES_DB: gtn2
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gtn2 -d gtn2"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  game:
    build:
      context: .
      dockerfile: game/backend/Dockerfile
    environment:
      PORT: 3000
      APP_URL: ${APP_URL}
      SUPERTOKENS_CONNECTION_URI: ${SUPERTOKENS_CONNECTION_URI}
      SUPERTOKENS_API_KEY: ${SUPERTOKENS_API_KEY:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      SUPERTOKENS_DASHBOARD_ADMINS: ${SUPERTOKENS_DASHBOARD_ADMINS:-}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to your PostgreSQL connection string}
      SIMULATION_SERVICE_KEY: ${SIMULATION_SERVICE_KEY:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

# Compose prefixes this volume with the checkout-specific project name.
volumes:
  postgres-data:
