services:
  game:
    build:
      context: .
      dockerfile: game/backend/Dockerfile
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
